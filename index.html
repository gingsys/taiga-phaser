<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taiga - Guardiana de Reliquias</title>
    <style>
      #voice-control {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        font-family: sans-serif;
      }
      #voice-toggle-btn {
        width: 56px;
        height: 56px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 3px solid #52525b;
        background: #f4f4f5;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
      }
      #voice-toggle-btn img {
        width: 30px;
        height: 30px;
        image-rendering: pixelated;
      }
      #voice-toggle-btn:hover:not(:disabled) {
        border-color: #a1a1aa;
      }
      #voice-toggle-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #voice-toggle-btn.escuchando {
        border-color: #ef4444;
        animation: voice-pulse 1s ease-in-out infinite;
      }
      @keyframes voice-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
        50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      }
      #voice-status {
        font-size: 11px;
        color: #d4d4d8;
        background: rgba(24, 24, 27, 0.8);
        padding: 2px 8px;
        border-radius: 6px;
        max-width: 220px;
        text-align: right;
      }
    </style>
  </head>
  <body class="bg-zinc-950 h-screen w-screen m-0 flex flex-col items-center justify-center overflow-hidden">
    <header class="mb-6">
      <h1 class="text-2xl text-emerald-400 drop-shadow-md" style="font-family: 'PressStart2P'; visibility: hidden; position: absolute;">.</h1>
    </header>
    <div id="voice-control">
      <button id="voice-toggle-btn" title="Cambiar a modo de voz">
        <img id="voice-toggle-icon" alt="Modo de entrada actual" />
      </button>
      <span id="voice-status"></span>
    </div>
    <div id="game-container" class="border-4 border-zinc-700 shadow-2xl shadow-emerald-900/20"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
